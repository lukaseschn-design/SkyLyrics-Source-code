plugins {
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings file("mappings/identity.tiny")
    }

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu API (optional at runtime)
    compileOnly "com.terraformersmc:modmenu:17.0.1"

    // NanoVG & Native APIs (Bundled via Jar-in-Jar for custom UI rendering)
    implementation "org.lwjgl:lwjgl-nanovg:3.3.3"
    include "org.lwjgl:lwjgl-nanovg:3.3.3"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-windows"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-windows-arm64"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-linux"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-linux-arm64"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-macos"
    include "org.lwjgl:lwjgl-nanovg:3.3.3:natives-macos-arm64"

    compileOnly "net.java.dev.jna:jna:5.14.0"
    compileOnly "net.java.dev.jna:jna-platform:5.14.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(Integer.parseInt(project.java_version))
    targetCompatibility = JavaVersion.toVersion(Integer.parseInt(project.java_version))

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
